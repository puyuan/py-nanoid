name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.7', '3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Test installed package with tox
        run: |
          version=${{ matrix.python }}
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements-tox.txt
          python -m tox -e "py${version/./}"
  legacy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['2.7', '3.5', '3.6']
    steps:
      - uses: actions/checkout@v7
      - name: Test oldest interpreters with tox
        run: |
          version=${{ matrix.python }}
          tox_env=py${version/./}
          tar --exclude=.git --exclude=.tox -cf - . | \
            docker run --rm -i -w /src python:"$version" \
              sh -c "tar -xf - -C /src && \
                     python -m pip install --upgrade pip && \
                     python -m pip install --upgrade -r requirements-tox.txt && \
                     python -m tox -e $tox_env"
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: python -m pip install --upgrade pip build twine
      - run: python -m pip install --upgrade -r requirements.txt
      - run: python -m flake8 --max-line-length=99 nanoid test setup.py
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Test installed wheel away from source checkout
        run: |
          python -m pip install dist/*.whl
          cp -r test "$RUNNER_TEMP/nanoid-tests"
          cd "$RUNNER_TEMP"
          python -m unittest discover -s nanoid-tests -p '*_test.py'
