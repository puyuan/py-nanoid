[build-system]
requires = [
  "setuptools; python_version >= '3.9'",
  "setuptools<76; python_version >= '3.8' and python_version < '3.9'",
  "setuptools<68; python_version >= '3.7' and python_version < '3.8'",
  "setuptools<60; python_version >= '3.6' and python_version < '3.7'",
  "setuptools<51; python_version >= '3.5' and python_version < '3.6'",
  "setuptools<45; python_version < '3.5'",
]
build-backend = "setuptools.build_meta"
