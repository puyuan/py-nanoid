[tox]
envlist = py27,py35,py36,py37,py38,py39,py310,py311,py312,py313,py314,py315

[testenv]
deps = -r{toxinidir}/requirements.txt
changedir = {envtmpdir}
commands_pre = python -c "import os, shutil; shutil.rmtree('tests') if os.path.exists('tests') else None; shutil.copytree(r'{toxinidir}/test', 'tests')"
commands = python -m pytest tests
